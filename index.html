<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04050b">
<title>Listen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #04050b; color: #e8ecff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; transition: opacity .8s;
  }
  #begin {
    pointer-events: auto; font: inherit; font-size: 17px; letter-spacing: .08em; color: #e8ecff;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 12px 32px; cursor: pointer;
  }
  #begin:disabled { opacity: .5; }
  #msg { font-size: 14px; color: #8a93b8; text-align: center; max-width: 340px; padding: 0 16px; min-height: 1.2em; }
  #hear { font-size: 15px; letter-spacing: .25em; color: #b7c0e8; height: 1.2em; opacity: 0; transition: opacity .25s; }
  #reveal {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center; background: #fff; color: #141c3a;
    opacity: 0; pointer-events: none; transition: opacity 1.2s;
  }
  #reveal.show { opacity: 1; pointer-events: auto; }
  #coords {
    font: 500 clamp(20px, 6vw, 34px) ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: text; user-select: text;
  }
  #revealText { font-size: 16px; color: #4a5378; max-width: 420px; }
  #mapLink { font-size: 16px; color: #1d3fbf; text-decoration: none; border: 1px solid #c8d0ee; border-radius: 999px; padding: 10px 22px; }
  #dbg {
    position: fixed; top: 8px; left: 8px; z-index: 10; display: none;
    width: min(300px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); overflow: auto;
    background: rgba(10,12,24,.9); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 10px;
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: #cfd6ff;
  }
  #dbg label { display: block; margin-top: 6px; }
  #dbg input[type=range] { width: 100%; }
  #dbg button {
    font: inherit; color: #cfd6ff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    border-radius: 6px; padding: 4px 8px; margin: 4px 4px 0 0; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hear"></div>
  <div id="msg"></div>
  <button id="begin" type="button">Begin</button>
</div>
<div id="reveal">
  <div id="coords"></div>
  <div id="revealText"></div>
  <a id="mapLink" target="_blank" rel="noopener">Open in Maps</a>
</div>
<div id="dbg"></div>

<script>
"use strict";
// Untouched copy of this page, used by the setup box's "Download page" button.
const PAGE_SRC = "<!doctype html>\n" + document.documentElement.outerHTML;

/* =====================================================================
   CONFIG — edit this block
   ===================================================================== */
const CONFIG = {
  // The melody. Any of these work:
  //   ["C", "G", "Bb"]               plain note names
  //   ["C4", "G4:2", "Bb4"]          with octaves, ":2" = a long note
  //   [["C4", 1], ["G4", 2]]         [note, beats] pairs
  //   "C4 G4:2 Bb"                   one string
  // A note without an octave number takes the octave closest to the note before it.
  // Rhythm is never checked. Octave and beats shape the star hint
  // (height = pitch, spacing and flash length = rhythm).
  // Back-to-back repeats of the same note only need to be sung once.
  SEQUENCE: ["C", "G", "B", "G", "C", "B", "A", "G", "A", "B", "G"],
  BEAT_SECONDS: 0.5,          // tempo of the star hint
  HINT_GAP_SECONDS: 2,        // pause before the hint repeats

  COORDS: { lat: 0.00000, lng: 0.00000 },   // decimal degrees; west longitude is negative
  REVEAL_TEXT: "",            // optional line under the coordinates
  INSTRUCTION: "Listen to the stars. Answer them.",

  // Matching. Whatever they sing is split into notes and the whole phrase is scored
  // against the melody on a sliding scale: a note a little off costs a little, a note way
  // off costs more, and a wrong, skipped or extra note just adds to the score. The key is
  // allowed to wander, so singing a leap a bit short and carrying on from there only costs
  // that one slip. Nothing fails mid-song; it solves once the whole melody adds up.
  //  "intervals": any key works.
  //  "absolute":  the exact note names in SEQUENCE are required (octave ignored).
  MATCH: "intervals",
  OCTAVE_MATTERS: false,      // if true, notes must be in the right octaves relative
                              // to each other (up 5 is not down 7)
  LENIENCY: 0.3,              // average miss allowed per note, 0-1. Higher = more forgiving,
                              // but lets more made-up singing through
  NOTE_TOLERANCE: 0.9,        // semitones off before a note counts as completely wrong
                              // (smaller misses cost less, bigger ones climb steeply)
  COOLDOWN_S: 3,              // after a run ends without solving (they stop singing), the
                              // stars stop listening this long. 0 turns it off.

  // Detection. Tune these at the real spot with ?debug on the URL.
  MIN_DB: -50,                // sounds quieter than this are ignored
  CLARITY: 0.7,               // 0-1, how cleanly pitched a sound must be
  MIN_NOTE_MS: 100,           // shorter sounds are ignored (slides, consonants, glitches)
  SILENCE_RESET_MS: 3000,     // a pause longer than this ends the attempt
  MIN_HZ: 70,
  MAX_HZ: 1200
};
/* ===================================================================== */

const params = new URLSearchParams(location.search);
const DEBUG = params.has("debug");
const SOLVED_KEY = "supernova-solved-" + (params.get("s") || "default").slice(0, 64);
const S1 = 2.0, S2 = 3.4, S3 = 3.9, TW = 3.65, ARM_MS = 600;   // supernova timeline (seconds)
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

/* ---------- setup carried in the link (?s=...) ---------- */
// The setup box in ?debug mode packs melody, coordinates and reveal text into
// the link, so the file never has to be edited by hand.
const b64e = s => {
  let t = "";
  for (const x of new TextEncoder().encode(s)) t += String.fromCharCode(x);
  return btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const b64d = s => {
  const t = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  return new TextDecoder().decode(Uint8Array.from(t, c => c.charCodeAt(0)));
};
// "C4 G4:2 Bb" -> [["C4",1],["G4",2],["Bb4",1]]. ":n" sets beats (default 1).
// A note written without an octave takes the octave closest to the note before it.
function parseMelody(text) {
  const out = [];
  let prev = null;
  for (const tok of String(text).trim().split(/[\s,]+/).filter(Boolean)) {
    const m = /^([A-Ga-g])([#b]?)(-?\d)?(?::(\d*\.?\d+))?$/.exec(tok);
    if (!m) throw new Error("Can't read note: " + tok);
    const name = m[1].toUpperCase() + m[2];
    let oct = m[3] !== undefined ? +m[3] : 4;
    if (m[3] === undefined && prev !== null) {
      const po = Math.floor(prev / 12) - 1;
      let best = Infinity;
      for (const o of [po - 1, po, po + 1]) {
        const dist = Math.abs(toMidi(name + o) - prev);
        if (dist < best) { best = dist; oct = o; }
      }
    }
    prev = toMidi(name + oct);
    out.push([name + oct, m[4] ? +m[4] : 1]);
  }
  if (!out.length) throw new Error("The melody is empty.");
  return out;
}
let setupError = "";
if (params.has("s")) {
  try {
    const s = JSON.parse(b64d(params.get("s")));
    if (s.m) CONFIG.SEQUENCE = parseMelody(s.m);
    if (typeof s.lat === "number" && typeof s.lng === "number") CONFIG.COORDS = { lat: s.lat, lng: s.lng };
    if (typeof s.t === "string") CONFIG.REVEAL_TEXT = s.t;
  } catch (err) {
    setupError = "This link's setup is broken: " + err.message;
  }
}

const cfg = Object.assign({}, CONFIG);
const R = Math.random;
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const eio = k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
if (params.has("reset")) store.del(SOLVED_KEY);

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const ui = document.getElementById("ui"), msgEl = document.getElementById("msg");
const beginBtn = document.getElementById("begin"), hearEl = document.getElementById("hear");
const revealEl = document.getElementById("reveal");
function msg(s) { msgEl.textContent = s || ""; }

/* ---------- melody ---------- */
function toMidi(s) {
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(s).trim());
  if (!m) throw new Error("Bad note name in SEQUENCE: " + s);
  return 12 * (+m[3] + 1) + BASE[m[1].toUpperCase()] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
}
const mod12 = v => ((v % 12) + 12) % 12;
const exactOctave = () => cfg.MATCH === "intervals" && cfg.OCTAVE_MATTERS;
const notes = [];   // one star per note in SEQUENCE
const steps = [];   // what they have to play (back-to-back repeats merged)
let totalBeats = 0, configError = "";
// Accepts every SEQUENCE format listed in CONFIG and turns it into [note, beats] pairs.
function normalizeSequence(seq) {
  if (typeof seq === "string") return parseMelody(seq);
  if (!Array.isArray(seq)) throw new Error("SEQUENCE should be a list of notes.");
  return parseMelody(seq.map(x => Array.isArray(x)
    ? String(x[0]).trim() + (x[1] !== undefined && x[1] !== null ? ":" + x[1] : "")
    : String(x).trim()).join(" "));
}
try {
  CONFIG.SEQUENCE = normalizeSequence(CONFIG.SEQUENCE);
  for (const [name, beats] of CONFIG.SEQUENCE) {
    const midi = toMidi(name);
    notes.push({ midi, pc: mod12(midi), beats: +beats || 1, start: totalBeats, step: 0, x: 0, y: 0 });
    totalBeats += +beats || 1;
  }
  if (!notes.length) configError = "SEQUENCE is empty. Add notes in CONFIG.";
} catch (err) {
  configError = err.message; notes.length = 0;
}
function buildSteps() {
  // Same-name notes in a row merge, unless octave matters (then an octave jump is a real step).
  steps.length = 0;
  for (const n of notes) {
    const prev = steps[steps.length - 1];
    if (!prev || (exactOctave() ? prev.midi !== n.midi : prev.pc !== n.pc)) steps.push({ pc: n.pc, midi: n.midi });
    n.step = steps.length - 1;
  }
}
buildSteps();
const loopLen = Math.max(0.1, totalBeats * CONFIG.BEAT_SECONDS + CONFIG.HINT_GAP_SECONDS);

/* ---------- layout ---------- */
let W = 0, H = 0, u = 1, SX = 0, SY = 0, DIAG = 1, bg = [];
function layout() {
  const d = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  u = cl(Math.min(W / 500, H / 450), 0.7, 1.6);
  SX = W / 2; SY = H * 0.2;
  DIAG = Math.max(Math.hypot(SX, SY), Math.hypot(W - SX, SY), Math.hypot(SX, H - SY), Math.hypot(W - SX, H - SY));
  const count = Math.min(420, Math.round((W * H) / 2200));
  bg = Array.from({ length: count }, () => ({ x: R(), y: R(), r: R() * 1.2 + 0.3, p: R() * 6.3, s: R() * 1.5 + 0.3, z: R() }));
  const x0 = W * 0.1, x1 = W * 0.9, yTop = H * 0.56, yBot = H * 0.86;
  const lastStart = notes.length ? notes[notes.length - 1].start : 0;
  let lo = Infinity, hi = -Infinity;
  for (const n of notes) { lo = Math.min(lo, n.midi); hi = Math.max(hi, n.midi); }
  for (const n of notes) {
    n.x = lastStart > 0 ? x0 + (n.start / lastStart) * (x1 - x0) : W / 2;
    n.y = hi > lo ? yBot - ((n.midi - lo) / (hi - lo)) * (yBot - yTop) : (yTop + yBot) / 2;
  }
}
window.addEventListener("resize", layout);
layout();

function glow(x, y, r, col, a) {
  if (r <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`);
  g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}

/* ---------- state ---------- */
let phase = "idle", t0 = 0, wT = -1, ins = 0, miss = 0, step = 0;
let parts = [], deb = [], revealed = false, running = true, lastT = performance.now();

/* ---------- audio + mic ---------- */
let ac = null, master = null, stream = null, analyser = null, buf = null, ds = null, nsdfBuf = null;
let listening = false;
let live = { db: -120, freq: 0, clar: 0, voiced: false, midiF: 0, pc: -1 };
let lastVoiced = 0, unvoicedSince = 0, lastHeard = 0;

function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createDynamicsCompressor();
    master.connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}

async function begin() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msg("Open this page directly in Safari or Chrome, not inside another app.");
    return;
  }
  ensureAudio();
  beginBtn.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (err) {
    beginBtn.disabled = false;
    msg(err && err.name === "NotAllowedError"
      ? "This needs your microphone. Allow it, then reload the page."
      : "Couldn't start the microphone. Reload and try again.");
    return;
  }
  const src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  ds = new Float32Array(analyser.fftSize / 2);
  listening = true;
  lastVoiced = performance.now();
  beginBtn.style.display = "none";
  beginBtn.disabled = false;
  msg(CONFIG.INSTRUCTION);
  requestWake();
}
beginBtn.addEventListener("click", begin);

function stopMic() {
  listening = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  hearEl.style.opacity = 0;
}

let wake = null;
async function requestWake() {
  try { if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (ac && ac.state === "suspended") ac.resume();
    if (listening || phase !== "idle") requestWake();
  }
});

/* ---------- pitch detection (McLeod pitch method) ---------- */
function mpm(x, sr, minF, maxF) {
  const n = x.length;
  const tMin = Math.max(2, Math.floor(sr / maxF));
  const tMax = Math.min(Math.floor(n / 2) - 2, Math.ceil(sr / minF));
  const L = tMax + 2;
  if (!nsdfBuf || nsdfBuf.length < L) nsdfBuf = new Float32Array(L);
  const ns = nsdfBuf;
  let m = 0;
  for (let i = 0; i < n; i++) m += 2 * x[i] * x[i];
  for (let tau = 0; tau < L; tau++) {
    if (tau > 0) m -= x[n - tau] * x[n - tau] + x[tau - 1] * x[tau - 1];
    let acf = 0;
    const lim = n - tau;
    for (let i = 0; i < lim; i++) acf += x[i] * x[i + tau];
    ns[tau] = m > 1e-12 ? (2 * acf) / m : 0;
  }
  let i = 1;
  while (i < L && ns[i] > 0) i++;
  const peaks = [];
  let best = -1;
  while (i < L) {
    while (i < L && ns[i] <= 0) i++;
    let pv = -1, pi = -1;
    while (i < L && ns[i] > 0) { if (ns[i] > pv) { pv = ns[i]; pi = i; } i++; }
    if (pi > 0) { peaks.push(pi); if (pv > best) best = pv; }
  }
  if (!peaks.length) return [0, 0];
  let k = -1;
  for (const p of peaks) if (p >= tMin && ns[p] >= 0.9 * best) { k = p; break; }
  if (k < 1 || k >= L - 1) return [0, 0];
  const a = ns[k - 1], b = ns[k], c = ns[k + 1], den = a - 2 * b + c;
  const d = den !== 0 ? (0.5 * (a - c)) / den : 0;
  return [sr / (k + d), Math.min(1, b - 0.25 * (a - c) * d)];
}

function detect(now) {
  analyser.getFloatTimeDomainData(buf);
  const h = ds.length;
  let mean = 0, sum = 0;
  for (let i = 0; i < h; i++) { const v = (buf[2 * i] + buf[2 * i + 1]) * 0.5; ds[i] = v; mean += v; }
  mean /= h;
  for (let i = 0; i < h; i++) { ds[i] -= mean; sum += ds[i] * ds[i]; }
  const db = 20 * Math.log10(Math.sqrt(sum / h) + 1e-9);
  let freq = 0, clar = 0;
  if (db >= cfg.MIN_DB) [freq, clar] = mpm(ds, ac.sampleRate / 2, cfg.MIN_HZ, cfg.MAX_HZ);
  const voiced = db >= cfg.MIN_DB && clar >= cfg.CLARITY && freq >= cfg.MIN_HZ && freq <= cfg.MAX_HZ;
  const midiF = freq > 0 ? 69 + 12 * Math.log2(freq / 440) : 0;
  const pc = voiced ? ((Math.round(midiF) % 12) + 12) % 12 : -1;
  live = { db, freq, clar, voiced, midiF, pc };
  handle(now, voiced, midiF);
}

/* ---------- note logic: whole-phrase scoring ---------- */
// What they sing is split into notes (seg = the note being sung right now, sung = finished
// notes). The whole run is then scored against the melody at once on a sliding scale, with the
// key allowed to drift, so it judges whether they've got the tune rather than each note.
let sung = [];             // finished notes this attempt: { p: pitch (fractional MIDI), ms, canStart }
let seg = null;            // the note being sung right now: { start, p, samples, devSince, last }
let smooth = [];           // last few raw pitches; their median tames vibrato and detector glitches
let fit = null;            // latest scoring: { progress, cost, key }
let dirty = false, lastScore = 0;
const SPLIT = 0.6;         // semitones away from the current note before it might be a new note...
const SPLIT_MS = 60;       // ...and it has to stay away this long (vibrato swings back sooner)
// Score costs. A note off by e x NOTE_TOLERANCE costs e^2 up to 1; past that it climbs steeply.
const SC = {
  MISS_STEEP: 2,           // extra cost per NOTE_TOLERANCE beyond the tolerance (very wrong notes)
  DRIFT: 0.3,              // per semitone the key moves between two melody notes (singing by ear)...
  DRIFT_FREE: 0.75,        // ...up to this many semitones;
  DRIFT_STEEP: 1.2,        // beyond it, per semitone (a jump sung very wrong)
  SKIP: 1,                 // a melody note they didn't sing
  EXTRA: 0.8,              // an extra note that doesn't fit...
  EXTRA_SHORT: 0.15        // ...or a short one (a slide or scoop between notes)
};
const GLITCH_MS = 220;
const FREE_LEAD = 3;       // the melody has to start within this many notes of the start of a run...
const RESTART_PAUSE_MS = 700;   // ...or of a pause at least this long (a restart)
const SETTLE_MS = 200;     // the note being sung must be held this long before it can complete the melody
const KSTEP = 0.25;        // key resolution, semitones
const wrap = v => v - 12 * Math.round(v / 12);
const fold = v => (exactOctave() ? v : wrap(v));          // octave ignored: compare within -6..+6
function median(a) {
  const s = a.slice().sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
let sinceBreak = 0, lastNoteEnd = -Infinity;   // notes since the last pause, and when the last note ended
function newAttempt() { step = 0; sung = []; seg = null; smooth = []; fit = null; cache = null; sinceBreak = 0; lastNoteEnd = -Infinity; }

// Short cooldown after a run that ended without solving. It survives a reload (stored with a
// wall-clock end time), so refreshing doesn't skip it.
const COOL_KEY = "supernova-cool-" + (params.get("s") || "default").slice(0, 64);
let coolN = 0, coolUntil = 0;                  // coolN counts unsolved runs; coolUntil is in performance.now() time
if (params.has("reset")) store.del(COOL_KEY);
try {
  const c = JSON.parse(store.get(COOL_KEY) || "null");
  if (c && !DEBUG) coolUntil = performance.now() + Math.max(0, (+c.until || 0) - Date.now());
} catch (e) {}
const cooling = () => performance.now() < coolUntil;
function startCooldown() {
  coolN++;
  if (!(cfg.COOLDOWN_S > 0)) return;
  coolUntil = performance.now() + cfg.COOLDOWN_S * 1000;
  if (!DEBUG) store.set(COOL_KEY, JSON.stringify({ until: Date.now() + cfg.COOLDOWN_S * 1000 }));
}

function handle(now, voiced, mf) {
  if (phase !== "idle" || !steps.length) return;
  if (cooling()) { seg = null; smooth = []; lastVoiced = now; return; }
  if (voiced) {
    lastVoiced = now; unvoicedSince = 0;
    if (seg && !exactOctave()) mf = seg.p + wrap(mf - seg.p);   // detector octave slips stay on the note
    smooth.push(mf); if (smooth.length > 5) smooth.shift();
    const sp = median(smooth);
    if (!seg) {
      if (now - lastNoteEnd >= RESTART_PAUSE_MS) sinceBreak = 0;   // after a pause they may be starting over
      seg = { start: now, p: sp, samples: [sp], devSince: 0, last: now };
    }
    else if (Math.abs(fold(sp - seg.p)) > SPLIT) {
      if (!seg.devSince) seg.devSince = now;
      if (now - seg.devSince >= SPLIT_MS) {                       // it really moved: a new note
        closeSeg(seg.devSince);
        seg = { start: now - SPLIT_MS, p: sp, samples: [sp], devSince: 0, last: now };
        smooth = [sp];
      }
    } else {
      seg.devSince = 0;
      seg.samples.push(sp); if (seg.samples.length > 150) seg.samples.shift();
      seg.p = median(seg.samples);
    }
    seg.last = now;
    dirty = true;
  } else {
    if (!unvoicedSince) unvoicedSince = now;

/* ---------- supernova ---------- */

function noise() {

    f.type = "lowpass";

    g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(0.7, T + S1);
    g.gain.exponentialRampToValueAtTime(0.0001, T + S2);

    g.gain.setValueAtTime(0.0001, B); g.gain.exponentialRampToValueAtTime(1, B + 0.02);

    og.gain.setValueAtTime(0.0001, B); og.gain.exponentialRampToValueAtTime(0.9, B + 0.03);

/* ---------- drawing ---------- */
function draw(now) {

  miss = Math.max(0, miss - dt * 1.5);

  const e = nt - S3, rad = e >= 0 ? waveR(e) : 0, f = cl(rad / DIAG, 0, 1);

  let sh = ins * 1.5, sd = 1;

    else if (nt < S2) { const k = (nt - S1) / (S2 - S1); sh = 5 * (1 - k); sd = 0.4 - 0.2 * k; }
    else if (nt < S3) { sh = 0; sd = 0.2; }

  ctx.globalCompositeOperation = "lighter";

  const M = Math.max(W, H);

  glow(W * 0.82, H * 0.5, M * 0.3, "20,80,110", 0.1 * sd);

    const a = (0.25 + 0.6 * Math.abs(Math.sin(t * s.s + s.p))) * sd;
    ctx.fillStyle = `rgba(215,225,255,${a})`;

  }

    const quiet = phase === "idle" && cooling() ? 0.3 : 1;     // stars go dim and the hint pauses during a cooldown
    for (const n of notes) {

      else if (hint) { glow(n.x, n.y, 18 * u, "190,210,255", 0.6); glow(n.x, n.y, 5 * u, "240,245,255", 1); }

    glow(SX, SY, r * 3.4, col, 0.22 + warm * 0.15);
    glow(SX, SY, r * 1.9, col, 0.5);

  el.append(setup);
  const boxStyle = "display:block;width:100%;font:inherit;color:inherit;background:rgba(255,255,255,.06);" +
    "border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 6px;margin-top:2px;-webkit-user-select:text;user-select:text";
  const field = (label, value, rows) => {
    const l = document.createElement("label"), i = document.createElement(rows ? "textarea" : "input");
    i.value = String(value); i.style.cssText = boxStyle; i.spellcheck = false; i.autocomplete = "off";
    if (rows) i.rows = rows;
    l.append(label, i);
    setup.append(l);
    return i;
  };
  const mIn = field("Melody, e.g. C4 G4:2 Bb (octave optional)",
    CONFIG.SEQUENCE.map(([n, b]) => (b === 1 ? n : n + ":" + b)).join(" "), 2);
  const preview = document.createElement("div");
  setup.append(preview);
  const latIn = field("Latitude", CONFIG.COORDS.lat);
  const lngIn = field("Longitude (west is negative)", CONFIG.COORDS.lng);
  const tIn = field("Line under coordinates (optional)", CONFIG.REVEAL_TEXT);
  const showPreview = () => {
    try {
      const seq = parseMelody(mIn.value);
      preview.textContent = "Reads as: " + seq.map(([n, b]) => (b === 1 ? n : n + ":" + b)).join(" ") + ` (${seq.length} notes)`;
      preview.style.color = "";
      return true;
    } catch (err) {
      preview.textContent = err.message;
      preview.style.color = "#ff9a9a";
      return false;
    }
  };
  mIn.oninput = showPreview;
  showPreview();
  const encodeSetup = () => {
    const s = { m: mIn.value.trim() };
    const la = parseFloat(latIn.value), ln = parseFloat(lngIn.value);
    if (Number.isFinite(la) && Number.isFinite(ln)) { s.lat = la; s.lng = ln; }
    if (tIn.value.trim()) s.t = tIn.value.trim();
    return b64e(JSON.stringify(s));
  };
  const pageUrl = String(location.href || "").split(/[?#]/)[0];
  const sRow = document.createElement("div");
  sRow.style.marginTop = "6px";
  setup.append(sRow);
  const linkOut = field("Share link (put this in the QR code)", "");
  linkOut.readOnly = true;
  btn(sRow, "Apply & test", () => {
    if (showPreview()) location.href = pageUrl + "?s=" + encodeSetup() + "&debug";
  });
  btn(sRow, "Make share link", () => {
    if (!showPreview()) return;
    linkOut.value = pageUrl + "?s=" + encodeSetup();
    try { linkOut.select(); navigator.clipboard.writeText(linkOut.value); } catch (e) {}
  });
  btn(sRow, "Download page", async () => {
    if (!showPreview()) return;
    const la = parseFloat(latIn.value), ln = parseFloat(lngIn.value);
    const settings = Object.assign({}, cfg, {
      SEQUENCE: parseMelody(mIn.value),
      COORDS: Number.isFinite(la) && Number.isFinite(ln) ? { lat: la, lng: ln } : CONFIG.COORDS,
      REVEAL_TEXT: tIn.value.trim()
    });
    let src = PAGE_SRC;
    try {   // the hosted file itself is the cleanest source; fall back to the in-memory copy
      const r = await fetch(pageUrl, { cache: "no-store" });
      if (r.ok) { const t = await r.text(); if (t.includes("const CONFIG = {")) src = t; }
    } catch (e) {}
    let out;
    try { out = bakeSource(src, settings); } catch (err) { msg(err.message); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
    a.download = "index.html";
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    msg("Downloaded index.html with these settings. Upload it in place of the old one.");
  });
}

// Rewrites the CONFIG block of this page's source with new values.
function bakeSource(src, s) {
  const start = src.indexOf("const CONFIG = {"), end = src.indexOf("\n};", start);
  if (start < 0 || end < 0) throw new Error("Couldn't find the CONFIG block to rewrite.");
  let block = src.slice(start, end);
  const set = (re, text) => {
    if (!re.test(block)) throw new Error("Couldn't find " + text.split(":")[0] + " in CONFIG.");
    block = block.replace(re, () => text);
  };
  const seq = s.SEQUENCE.map(([n, b]) => `["${n}", ${+b}]`).join(", ");
  block = block.replace(/\n\s*\/\/ THIS IS A TEST SCALE[^\n]*/, "");
  set(/SEQUENCE: \[.*\],/, `SEQUENCE: [${seq}],`);
  set(/COORDS: \{[^}]*\},/, `COORDS: { lat: ${+s.COORDS.lat}, lng: ${+s.COORDS.lng} },`);
  set(/\bREVEAL_TEXT: "(?:[^"\\]|\\.)*",/, `REVEAL_TEXT: ${JSON.stringify(s.REVEAL_TEXT || "").replace(/</g, "\\u003c")},`);
  set(/\bMATCH: "[a-z]+",/, `MATCH: ${JSON.stringify(s.MATCH === "absolute" ? "absolute" : "intervals")},`);
  set(/\bOCTAVE_MATTERS: (true|false),/, `OCTAVE_MATTERS: ${!!s.OCTAVE_MATTERS},`);
  for (const k of ["LENIENCY", "NOTE_TOLERANCE", "MIN_DB", "CLARITY", "MIN_NOTE_MS",
                   "COOLDOWN_S", "SILENCE_RESET_MS"]) {
    if (!Number.isFinite(+s[k])) throw new Error("Bad value for " + k);
    set(new RegExp("\\b" + k + ": -?[\\d.]+,"), `${k}: ${+s[k]},`);
  }
  return src.slice(0, start) + block + src.slice(end);
}
// A note that is clearly not the next one in the melody (in the key they're singing in).
function wrongNote() {
  const k = fit ? fit.key : 0, j = Math.min(step, steps.length - 1);
  const near = m => [steps[j].midi, j > 0 ? steps[j - 1].midi : null].some(t => t !== null && Math.abs(fold(m - k - t)) < 2.5);
  for (const d of [3, -3, 4, -4, 5, -5, 6]) if (!near(steps[j].midi + k + d)) return steps[j].midi + k + d;
  return steps[j].midi + k + 6;
}
// A fake note, as if sung cleanly for 0.3 s.
function simNote(midi) {
  ensureAudio();
  if (phase !== "idle" || !steps.length || cooling()) return;
  seg = null; smooth = [];
  const now = performance.now();
  if (now - lastNoteEnd >= RESTART_PAUSE_MS + 300) sinceBreak = 0;
  sung.push({ p: midi, ms: 300, canStart: sinceBreak < FREE_LEAD });
  sinceBreak++; lastNoteEnd = now;
  rescore(performance.now());
  lastVoiced = performance.now();
}
function resetAll() {
  phase = "idle"; step = 0; ins = 0; wT = -1; miss = 0; parts = []; deb = [];
  newAttempt();
  coolN = 0; coolUntil = 0; store.del(COOL_KEY);
  revealed = false;
  revealEl.classList.remove("show"); revealEl.style.transition = "";
  ui.style.opacity = 1;
  if (!listening) beginBtn.style.display = "";
  msg(CONFIG.INSTRUCTION);
  if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(frame); }
}
const sgn = (v, digits = 1) => (v > 0 ? "+" : "") + v.toFixed(digits);
function updDebug() {
  if (!dRead) return;
  const L = live;
  let note = "—";
  if (L.freq > 0) {
    const m = Math.round(L.midiF), c = Math.round((L.midiF - m) * 100);
    note = `${NAMES[((m % 12) + 12) % 12]}${Math.floor(m / 12) - 1} ${c >= 0 ? "+" : ""}${c}¢`;
  }
  dRead.innerHTML =
    `mic: ${listening ? "on" : "off"} · phase: ${phase}<br>` +
    `pitch: ${L.freq ? L.freq.toFixed(1) + " Hz" : "—"} · ${note}<br>` +
    `clarity: ${L.clar.toFixed(2)} · level: ${L.db.toFixed(0)} dB<br>` +
    `counts: ${L.voiced ? "YES" : "no"} · stars: ${step}/${steps.length}<br>` +
    `cooldown: ${cooling() ? Math.ceil((coolUntil - performance.now()) / 1000) + "s left" : "none"} · failed attempts: ${coolN}<br>` +
    `match: ${cfg.MATCH === "intervals" ? "any key" : "exact notes"}${cfg.OCTAVE_MATTERS && cfg.MATCH === "intervals" ? ", octave matters" : ""}<br>` +
    `avg miss per note: ${fit && fit.progress > 1 ? (fit.cost / (fit.progress - 1)).toFixed(2) : "—"} (passes ≤ ${cfg.LENIENCY})` +
    (fit && fit.progress && cfg.MATCH === "intervals" ? ` · key shift ${sgn(fold(fit.key))}` : "") + "<br>" +
    `heard: ${sung.slice(-8).map(x => NAMES[mod12(Math.round(x.p))]).join(" ") || "—"}` +
    (seg ? ` [${NAMES[mod12(Math.round(seg.p))]}…]` : "");
}

/* ---------- main loop ---------- */
let lastDbg = 0;
function updHear(now) {
  if (listening && live.voiced) { hearEl.textContent = NAMES[live.pc]; hearEl.style.opacity = 1; lastHeard = now; }
  else if (now - lastHeard > 400) hearEl.style.opacity = 0;
}
function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  if (listening && analyser) detect(now);
  draw(now);
  updHear(now);
  if (DEBUG && now - lastDbg > 100) { lastDbg = now; updDebug(); }
}

msg(setupError || configError || CONFIG.INSTRUCTION);
if (DEBUG) buildDebug();
if (store.get(SOLVED_KEY) === "1" && !DEBUG) { showReveal(true); running = false; }
else requestAnimationFrame(frame);
</script>
</body>
